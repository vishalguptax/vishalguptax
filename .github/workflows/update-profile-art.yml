name: Update profile art

# Refreshes the contribution graph + stats card from real data every day.
# The portrait and info card are static: regenerate them locally when your
# photo or details change (see README comments).

"on":
  schedule:
    - cron: "17 0 * * *"   # ~05:47 IST daily
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - "contrib-heatmap.svg"
      - "stats.svg"
      - "data/**"

permissions:
  contents: write

jobs:
  art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scrape contribution calendar (public, no token)
        run: python scripts/fetch_contributions.py

      - name: Render contribution heatmap
        run: python scripts/render_heatmap_svg.py

      - name: Render stats card
        run: python scripts/render_stats_svg.py

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg stats.svg"
